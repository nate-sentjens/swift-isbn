name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: swift test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift test
  docs:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v5
      - run: SPI_BUILD=1 swift package generate-documentation
